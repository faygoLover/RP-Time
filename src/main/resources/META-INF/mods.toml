modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
# Нужен и серверу, и клиенту. Клиент без мода тоже пускается: солнце у него будет идти рывками раз в секунду.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# RP Core — необязательно: пауза вместе с /rptime, кто спит (Medicine), прокрутка ран и голода во сне.
[[dependencies.${mod_id}]]
    modId="rpcore"
    mandatory=false
    versionRange="[0.7.2,)"
    ordering="NONE"
    side="BOTH"
